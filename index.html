			border-radius: 999px;
			display: inline-flex;
			font-weight: 400;
			gap: .6em;
			padding: .7em 1.3em;
			text-decoration: none;
			transition: background-color .2s, border-color .2s, transform .2s;
		}

		#social a:hover {
			background-color: var(--button-hover);
