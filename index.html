		/* Background */

		/* Card */

		.portrait {

			height: auto;

			width: clamp(7rem, 18vmin, 11rem);

		.content {

		h1 {

		}

			border-top: 1px solid var(--border);
			cursor: default;
			display: flex;
			flex-direction: column;
			font-size: clamp(1rem, .75rem + 1.1vmin, 2rem);
			gap: .35em;
			padding-top: var(--space);
		}

		#contact .label {
			color: var(--muted);
			font-size: .85em;
			letter-spacing: .08em;
			text-transform: uppercase;

		/* Social */
		#social {
			display: flex;
			flex-wrap: wrap;
			font-size: clamp(.95rem, .7rem + .8vmin, 1.75rem);
			gap: .75em;
			justify-content: center;
		}

		#social a {
			align-items: center;
			background-color: var(--button);
			border: 1px solid var(--border);
			border-radius: 999px;
			display: inline-flex;
			font-weight: 400;
			gap: .6em;
			padding: .7em 1.3em;
			text-decoration: none;
			transition: background-color .2s, border-color .2s, transform .2s;
		}

		#social a:hover {
			background-color: var(--button-hover);
			border-color: var(--muted);
			transform: translateY(-1px);
		}

		#social a:active {
			transform: none;
		}

		#social svg {
			fill: currentColor;
			flex: none;
			height: 1.15em;
			width: 1.15em;
		}

			}

			#social svg {
				height: 1.4em;
				width: 1.4em;
			}
		}

			#social a {
				transition: none;
			}

			#social a:hover {
				transform: none;
			}
		}
