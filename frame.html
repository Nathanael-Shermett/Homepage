<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame</title>
<style>
html, body { margin: 0; background: #222; }
iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
const p = new URLSearchParams(location.search);
const f = document.getElementById('f');
const s = Number(p.get('s') || 1);
f.style.width = p.get('w') + 'px';
f.style.height = p.get('h') + 'px';
f.style.transform = 'scale(' + s + ')';
if (p.get('raw')) {
	fetch(p.get('raw'), { cache: 'no-store' }).then(r => r.text()).then(t => {
		t = t.replace('<head>', '<head><base href="' + p.get('url') + '">');
		if (p.get('force') === 'dark') {
			t = t.split('prefers-color-scheme: light').join('min-width: 99999px');
		}
		f.srcdoc = t;
	});
} else {
	f.src = p.get('url');
}
</script>
</body>
</html>
